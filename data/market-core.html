<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Market Core</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <h2>Market Core</h2>
    <canvas id="chart" width="1200" height="500"></canvas>

<script>
async function loadData() {
    const res = await fetch("data/market-core.json");
    const json = await res.json();

    const labels = json.price.map(p => p.time);

    const close = json.price.map(p => p.close);
    const high  = json.price.map(p => p.high);
    const low   = json.price.map(p => p.low);

    const ma10  = json.ma.ma10;
    const ma50  = json.ma.ma50;
    const ma150 = json.ma.ma150;
    const ma200 = json.ma.ma200;

    const ctx = document.getElementById("chart").getContext("2d");

    new Chart(ctx, {
        type: "line",
        data: {
            labels: labels,
            datasets: [
                {
                    label: "Close",
                    data: close,
                    borderColor: "black",
                    borderWidth: 1,
                    pointRadius: 0
                },
                {
                    label: "MA10",
                    data: ma10,
                    borderColor: "white"
                },
                {
                    label: "MA50",
                    data: ma50,
                    borderColor: "green"
                },
                {
                    label: "MA150",
                    data: ma150,
                    borderColor: "orange"
                },
                {
                    label: "MA200",
                    data: ma200,
                    borderColor: "red"
                }
            ]
        },
        options: {
            responsive: true,
            scales: {
                x: {
                    display: false
                }
            }
        }
    });
}

loadData();
</script>
</body>
</html>
